<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Fylo Data Storage Component</title>
</head>
<style>
    @media screen and (min-width: 768px) {
        .bubble-tail {
            position: absolute;
            bottom: -9px;
            left: 196px;
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 0px solid transparent;
            border-top: 18px solid white;
        }
    }
</style>

<body
    class="bg-(--blue-950) bg-[url(/fylo-data-storage-component-master/images/bg-mobile.png)] md:bg-[url(/fylo-data-storage-component-master/images/bg-desktop.png)] bg-no-repeat bg-center md:bg-bottom h-lvh flex justify-center items-center font-display">
    <main class="grid md:grid-cols-12 md:w-5xl gap-7 relative">
        <section
            class="col-span-1 grow-0 md:col-span-5 md:row-span-2 bg-(--blue-850) p-10 rounded-tr-[100px] rounded-xl">
            <p class="mb-9"><img src="./fylo-data-storage-component-master/images/logo.svg" alt="fylo logo svg"></p>
            <div class="flex gap-4">
                <p class="flex bg-(--blue-950) p-4 justify-center items-center rounded-lg"><img
                        src="./fylo-data-storage-component-master/images/icon-document.svg" alt="document icon svg"></p>
                <p class="flex bg-(--blue-950) p-4 justify-center items-center rounded-lg">
                    <img src="./fylo-data-storage-component-master/images/icon-folder.svg" alt="folder icon svg">
                </p>
                <p class="flex bg-(--blue-950) p-4 justify-self-center items-center rounded-lg">
                    <img src="./fylo-data-storage-component-master/images/icon-upload.svg" alt="upload icon svg">
                </p>
            </div>
        </section>
        <section
            class="col-span-1 grow-0 md:col-start-6 md:col-end-13 row-start-2 row-end-3 bg-(--blue-850) px-12 py-10 pt-12 pb-15 rounded-xl relative">
            <p class="text-white mb-5 font-light">You've used <span class="font-bold">815GB</span> of your
                storage</p>
            <div class="w-full">
                <div class="w-full h-4 bg-(--blue-950) flex items-center rounded-full mb-2 px-0.5">
                    <!--outer rectangle-->
                    <div class="w-3/4 h-3 background-gradient flex items-center justify-end rounded-full px-0.5">
                        <!-- gradient inner rectangle-->
                        <div class="bg-white w-2 h-2 rounded-full"></div> <!-- inner white circle -->
                    </div>
                </div>
                <ul class="text-white flex justify-between font-medium">
                    <li>0<span class="ml-1">GB</span></li>
                    <li>1000<span class="ml-1">GB</span></li>
                </ul>
            </div>
            <aside
                class="md:w-54 flex bg-white justify-center items-center py-5 gap-3 rounded-xl absolute top-40 right-20 md:absolute md:right-12 md:-top-14 p-4">
                <p class="font-bold text-5xl">185</p>
                <p class="uppercase text-(--greyish-blue) text-base">gb left</p>
                <div class="bubble-tail"></div>
            </aside>
        </section>
    </main>
</body>
</html>
